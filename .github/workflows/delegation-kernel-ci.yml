name: Delegation Kernel local contracts
on:
  pull_request:
    paths:
      - 'src/delegation/**'
      - 'tests/delegation.test.ts'
      - 'examples/delegation-demo.ts'
      - 'tsconfig.delegation.json'
      - 'docs/DELEGATION_KERNEL_V0_1.md'
      - '.github/workflows/delegation-kernel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile standalone hardened contracts
        run: npx --yes --package typescript@5.8.3 tsc -p tsconfig.delegation.json
      - name: Run 26 adversarial local boundary tests
        run: node .delegation-build/tests/delegation.test.js
      - name: Run isolated local demonstration
        run: node .delegation-build/examples/delegation-demo.js
