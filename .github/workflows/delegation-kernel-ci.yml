name: Delegation Kernel local contracts
on:
  pull_request:
    paths:
      - 'src/delegation/**'
      - 'app/delegation-audit.tsx'
      - 'app/(tabs)/settings.tsx'
      - 'tests/delegation.test.ts'
      - 'tests/*.test.cjs'
      - 'examples/delegation-demo.ts'
      - 'tsconfig.delegation.json'
      - 'docs/DELEGATION_P0_RECOVERY_V0_3.md'
      - 'docs/DELEGATION_DISPATCH_CLAIM_V0_4.md'
      - 'docs/DELEGATION_NATIVE_READINESS_V0_5.md'
      - 'docs/DELEGATION_EXPLICIT_BOOTSTRAP_V0_6.md'
      - 'docs/DELEGATION_KERNEL_V0_1.md'
      - '.github/workflows/delegation-kernel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile standalone hardened contracts
        run: npx --yes --package typescript@5.8.3 tsc -p tsconfig.delegation.json
      - name: Run 26 adversarial local boundary tests
        run: node .delegation-build/tests/delegation.test.js
      - name: Run SQLite crash recovery and atomic budget tests
        run: node tests/durable-sqlite.test.cjs
      - name: Run identity, policy and evidence boundary tests
        run: node tests/guarded-journal.test.cjs
      - name: Run 18 dispatch-claim and legacy-migration tests
        run: node tests/dispatch-claim.test.cjs
      - name: Verify read-only readiness and privacy projection
        run: node tests/readiness.test.cjs
      - name: Test Expo SQLite port and explicit native bootstrap
        run: node tests/expo-sqlite-port.test.cjs
      - name: Parse native Expo screen without bundling dependencies
        run: npx --yes --package esbuild@0.25.12 esbuild app/delegation-audit.tsx --outfile=/tmp/matverse-delegation-audit.js --format=esm
      - name: Parse Expo settings deep link
        run: npx --yes --package esbuild@0.25.12 esbuild 'app/(tabs)/settings.tsx' --outfile=/tmp/matverse-settings.js --format=esm
      - name: Run isolated local demonstration
        run: node .delegation-build/examples/delegation-demo.js
