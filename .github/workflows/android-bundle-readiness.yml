name: Android JS bundle reproducibility
on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/audit-pnpm-lock.cjs'
      - 'tests/pnpm-lock-audit.test.cjs'
      - '.github/workflows/android-bundle-readiness.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-and-bundle:
    # This write-capable job is restricted to its exact same-repository prototype branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/android-bundle-repro-v0-7'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout owned PR branch only
        uses: actions/checkout@v4
        with:
          ref: feat/android-bundle-repro-v0-7
          persist-credentials: true
      - name: Use pnpm compatible with lockfileVersion 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lock validator unit tests
        run: node --test tests/pnpm-lock-audit.test.cjs
      - name: Document initial manifest/lockfile drift (expected)
        continue-on-error: true
        run: node scripts/audit-pnpm-lock.cjs
      - name: Reconcile exact declared manifest without running dependency scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Enforce reconciled lock consistency
        run: node scripts/audit-pnpm-lock.cjs
      - name: Verify frozen dependency installation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish reconciled lockfile to the same draft PR branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'chore(deps): reconcile pnpm lockfile for reproducible Expo install'
          git push origin HEAD:refs/heads/feat/android-bundle-repro-v0-7
      - name: Export Android JavaScript/assets with Metro (NOT an APK)
        run: pnpm exec expo export --platform android --output-dir "${RUNNER_TEMP}/symbiodroid-android-js"
      - name: Summarize non-native artifact
        run: |
          test -d "${RUNNER_TEMP}/symbiodroid-android-js"
          echo "Metro Android JS export succeeded; this does NOT compile, install or run an Android APK."
